[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-agents"
version = "0.1.0"
description = "Auditable prop research and strictly local SPY/QQQ paper trading"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prop-research = "prizepicks_research.cli:main"
paper-research = "paper_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
